name: release

# Tag push -> build, test, full data build, pack, publish to nuget.org. Mirrors build.yml; only the
# core package (core-nuget/) and the data packages (data-nugets/) are published — never the
# degraded-source-paths core or the Monaco fixture in nugets/.

on:
  push:
    tags: ['*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job mint the OIDC token nuget.org trades for a short-lived publishing key.
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      # SponsorCheck bundles the sponsor list during pack on non-PR builds and needs a classic PAT
      # (org secret).
      GitHubToken: ${{ secrets.SPONSOR_CHECK_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache source downloads
        # Replicant's HTTP cache. Keyed on the files that hold the source URLs.
        uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-${{ hashFiles('src/Tests/Builder/NaturalEarth.cs', 'src/Tests/Builder/CountryLevels.cs', 'src/Tests/Builder/OsmData.cs', 'src/Tests/Builder/Geofabrik.cs') }}
          restore-keys: http-

      # The tag is the version: tag 1.2.3 (or v1.2.3) publishes 1.2.3. The data packages, the Monaco
      # fixture and the integration tests read <Version> straight from src/Directory.Build.props
      # (CoreVersion / Directory.Packages.props) rather than from -p:Version, so it is rewritten here
      # too to keep every package on the tag's version.
      - name: Resolve the version from the tag
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_ENV"
          sed -i "s#<Version>[^<]*</Version>#<Version>$version</Version>#" src/Directory.Build.props

      - name: Build
        # DeterministicSourcePaths=false: see build.yml — the coverage collector needs real paths.
        # The core package this produces in nugets/ is the integration-test feed only.
        run: dotnet build src --configuration Release -p:DeterministicSourcePaths=false -p:Version=${{ env.version }}

      - name: Unit tests
        run: src/Tests/bin/Release/net10.0/Tests --no-ansi --no-progress --report-trx --report-trx-filename unit.trx --results-directory TestResults --coverage --coverage-output-format cobertura --coverage-output unit.cobertura.xml

      - name: Coverage gate
        shell: pwsh
        run: ./src/coverage-check.ps1 -Report TestResults/unit.cobertura.xml -Threshold 100

      - name: MSBuild integration tests
        # See build.yml for what each consumer asserts.
        run: |
          set -e
          src/Tests/bin/Release/net10.0/Tests --no-ansi --no-progress --treenode-filter "/*/*/IntegrationFixture/BuildMonacoPackage"
          dotnet build IntegrationTests --configuration Release
          dotnet run --project IntegrationTests/RawConsumer --configuration Release --no-build
          dotnet run --project IntegrationTests/NtsConsumer --configuration Release --no-build
          dotnet run --project IntegrationTests/ConvertedConsumer --configuration Release --no-build
          dotnet run --project IntegrationTests/FilteredConsumer --configuration Release --no-build
          dotnet run --project IntegrationTests/RedirectedOutputConsumer --configuration Release --no-build
          dotnet run --project IntegrationTests/RedirectedRawConsumer --configuration Release --no-build
          src/Tests/bin/Release/net10.0/Tests --no-ansi --no-progress --treenode-filter "/*/*/InvalidLayerNameTests/*"

      - name: Full data build
        run: src/Tests/bin/Release/net10.0/Tests --no-ansi --no-progress --treenode-filter "/*/*/PackageBuilder/Generate"

      - name: Pack publish-grade core
        # Deterministic source paths (CI default) into core-nuget/, apart from nugets/.
        run: dotnet pack src/MapBundle/MapBundle.csproj --configuration Release -o core-nuget -p:Version=${{ env.version }}

      - name: Upload received snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received
          path: '**/*.received.*'
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            core-nuget/*.nupkg
            data-nugets/*.nupkg
          if-no-files-found: error

      # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
      # policy naming this repository and this workflow file, and returns a key good for an hour —
      # so this stays immediately before the push.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          # The nuget.org account the trusted publishing policy belongs to.
          user: SimonCropp

      - name: Push to nuget.org
        run: |
          set -e
          for package in core-nuget/*.nupkg data-nugets/*.nupkg; do
            dotnet nuget push "$package" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
